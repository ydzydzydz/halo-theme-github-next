apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-github-next-setting
spec:
  forms:
    - group: basic
      label: 基础设置
      formSchema:
        - $formkit: text
          name: name
          label: 站点信息设置 - 名称
          value: "ydzydzydz"
          help: 显示在大 Logo 下方的加粗名称
        - $formkit: textarea
          name: description
          label: 站点信息设置 - 描述
          value: "欢迎来到我的小站～"
          help: 显示在加粗名称下方的灰色文字
        - $formkit: array
          name: profile_meta
          label: 个人资料信息
          value:
            - text: "社会大学"
              icon: "octicon:organization-16"
              url: ""
            - text: "ShenZhen"
              icon: "octicon:location-16"
              url: ""
            - text: "your@example.com"
              icon: "octicon:mail-16"
              url: "mailto:your@example.com"
          addLabel: 添加资料信息
          emptyText: 暂无资料信息
          help: 可自定义内容、Iconify 图标和链接，并拖动调整显示顺序
          itemLabels:
            - type: text
              label: "$value.text"
          children:
            - $formkit: text
              name: text
              label: 内容
              value: ""
              placeholder: "社会大学"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:info-16"
              placeholder: "octicon:organization-16"
            - $formkit: text
              name: url
              label: 链接（可选）
              value: ""
              placeholder: "mailto:your@example.com"
        - $formkit: checkbox
          name: show_stats
          label: 是否显示网站统计信息
          value: true
          help: 开启后在前端大 Logo 资料区显示总文章数量、总评论数量和总访问量
        - $formkit: number
          name: activity_limit
          label: 首页站点动态显示条数
          value: 6
          min: 1
          max: 50
          help: 首页“站点动态”默认展示的最新记录数量
        - $formkit: checkbox
          name: contribution_graph_english
          label: 动态贡献图开启英文显示
          value: false
          help: 默认使用中文；开启后，首页动态贡献图及站点动态的月份、提示和操作文案使用英文显示
        - $formkit: select
          name: status
          label: 状态 Emoji
          value: "😊"
          help: 显示在前端大 Logo 右下角的小圆圈中
          options:
            - label: "😊 开心"
              value: "😊"
            - label: "🤔 思考"
              value: "🤔"
            - label: "💻 写代码"
              value: "💻"
            - label: "🚀 发布"
              value: "🚀"
            - label: "☕ 喝咖啡"
              value: "☕"
            - label: "📚 学习"
              value: "📚"
            - label: "🎧 听歌"
              value: "🎧"
            - label: "🌙 夜间模式"
              value: "🌙"
            - label: "🔥 忙碌"
              value: "🔥"
            - label: "✨ 灵感"
              value: "✨"
    - group: announcement
      label: 公告
      formSchema:
        - $formkit: checkbox
          name: enabled
          label: 显示公告
          value: false
          help: 开启并填写公告内容后，在前端菜单栏下方显示全宽公告横幅
        - $formkit: checkbox
          name: prayer_mode
          label: 开启哀悼模式
          value: false
          help: 开启后全站以灰色效果显示，可用于发布哀悼公告
        - $formkit: textarea
          name: content
          label: 公告内容
          value: ""
          placeholder: "请输入要发布的公告内容"
          help: 支持多行文本，内容会以纯文本方式显示
    - group: sidebar
      label: 侧边栏
      formSchema:
        - $formkit: checkbox
          name: wechat_official_account_enabled
          id: sidebar_wechat_official_account_enabled
          label: 显示公众号二维码
          value: false
          help: 开启后可在侧边栏展示公众号二维码
        - $formkit: attachment
          name: wechat_official_account_qrcode
          label: 公众号二维码
          value: ""
          accept: "image/*"
          if: $get(sidebar_wechat_official_account_enabled).value
          help: 上传或选择公众号二维码图片
        - $formkit: group
          name: love
          label: 恩爱设置
          value:
            enabled: false
            start_date: ""
            person_one_name: ""
            person_one_avatar: ""
            person_one_qq: ""
            person_two_name: ""
            person_two_avatar: ""
            person_two_qq: ""
          children:
            - $formkit: checkbox
              name: enabled
              id: sidebar_love_enabled
              label: 显示恩爱计时
              value: false
              help: 开启后在前端侧边栏显示两人的头像、名称和相恋计时
            - $formkit: datetime-local
              name: start_date
              if: $get(sidebar_love_enabled).value
              label: 开始在一起的日期和时间
              value: ""
              step: 1
              validation: required
              help: 计时会从此时间开始，前端精确显示到秒
            - $formkit: text
              name: person_one_name
              if: $get(sidebar_love_enabled).value
              label: 第一位的名称
              value: ""
              placeholder: "例如：小明"
              validation: required
            - $formkit: attachment
              name: person_one_avatar
              if: $get(sidebar_love_enabled).value
              label: 第一位的头像
              value: ""
              accept: "image/*"
              help: 可上传或选择头像；填写 QQ 号时会优先使用 QQ 头像
            - $formkit: text
              name: person_one_qq
              if: $get(sidebar_love_enabled).value
              label: 第一位的 QQ 号
              value: ""
              placeholder: "例如：12345678"
              validation: number
              help: 可选。填写后自动通过 QQ 号获取头像
            - $formkit: text
              name: person_two_name
              if: $get(sidebar_love_enabled).value
              label: 第二位的名称
              value: ""
              placeholder: "例如：小红"
              validation: required
            - $formkit: attachment
              name: person_two_avatar
              if: $get(sidebar_love_enabled).value
              label: 第二位的头像
              value: ""
              accept: "image/*"
              help: 可上传或选择头像；填写 QQ 号时会优先使用 QQ 头像
            - $formkit: text
              name: person_two_qq
              if: $get(sidebar_love_enabled).value
              label: 第二位的 QQ 号
              value: ""
              placeholder: "例如：87654321"
              validation: number
              help: 可选。填写后自动通过 QQ 号获取头像
        - $formkit: checkbox
          name: show_site_tags
          label: 显示站点标签
          value: false
          help: 开启后在前端左侧边栏显示文章数最多的 40 个标签
        - $formkit: number
          name: site_tag_limit
          label: 标签显示数量
          value: 40
          min: 1
          max: 80
          step: 1
          help: 按文章数量排序，建议设置 20 至 40 个
        - $formkit: select
          name: tag_animation
          label: 标签展示效果
          value: "globe"
          options:
            - label: "缓慢漂浮（推荐）"
              value: "float"
            - label: "地球仪旋转"
              value: "globe"
            - label: "环形跑马灯"
              value: "marquee"
            - label: "波浪浮动"
              value: "wave"
            - label: "自动换位"
              value: "shuffle"
          help: 地球仪旋转会持续计算动画，较吃设备性能；性能较弱的 Windows 设备建议选择缓慢漂浮、波浪浮动等 CSS 动画
        - $formkit: checkbox
          name: show_site_categories
          label: 显示站点分类
          value: false
          help: 开启后在前端左侧边栏显示文章数最多的分类
        - $formkit: number
          name: site_category_limit
          label: 分类显示数量
          value: 20
          min: 1
          max: 50
          step: 1
          help: 按文章数量排序，建议设置 10 至 20 个
    - group: icons
      label: 图标配置
      formSchema:
        - $formkit: text
          name: home
          label: 首页图标（/）
          value: "line-md:home"
          help: 对应后台菜单链接 /，填写 Iconify 图标名称，例如 line-md:home
        - $formkit: text
          name: posts
          label: 文章图标（/archives）
          value: "octicon:repo-16"
          help: 对应后台菜单链接 /archives，填写 Iconify 图标名称，例如 octicon:repo-16
        - $formkit: text
          name: default_category
          label: 默认分类图标（/categories/default）
          value: "octicon:bookmark-16"
          help: 对应后台菜单链接 /categories/default，填写 Iconify 图标名称，例如 octicon:bookmark-16
        - $formkit: text
          name: about
          label: 关于图标（/about）
          value: "octicon:person-16"
          help: 对应后台菜单链接 /about，填写 Iconify 图标名称，例如 octicon:person-16
        - $formkit: text
          name: links
          label: 友链图标（/links）
          value: "ri:links-line"
          help: 对应后台菜单链接 /links，填写 Iconify 图标名称，例如 ri:links-line
        - $formkit: text
          name: photos
          label: 图库图标（/photos）
          value: "lineicons:photos"
          help: 对应后台菜单链接 /photos，填写 Iconify 图标名称，例如 lineicons:photos
        - $formkit: text
          name: moments
          label: 瞬间图标（/moments）
          value: "mingcute:moment-line"
          help: 对应后台菜单链接 /moments，填写 Iconify 图标名称，例如 mingcute:moment-line
        - $formkit: text
          name: message
          label: 留言板图标（/message）
          value: "tabler:message"
          help: 对应后台菜单链接 /message，填写 Iconify 图标名称，例如 tabler:message
        - $formkit: text
          name: business
          label: 服务图标（/services）
          value: "octicon:briefcase-16"
          help: 对应后台菜单链接 /services，填写 Iconify 图标名称，例如 octicon:briefcase-16
        - $formkit: array
          name: custom_menu_icons
          label: 其他菜单栏自定义图标
          value: []
          addLabel: 添加菜单图标
          emptyText: 暂无自定义菜单图标，点击下方按钮添加
          help: 根据后台菜单栏路径逐条设置 Iconify 图标，例如 /tools 对应 octicon:tools-16
          itemLabels:
            - type: text
              label: "$value.path"
            - type: text
              label: "$value.icon"
          children:
            - $formkit: text
              name: path
              label: 菜单栏路径
              value: ""
              placeholder: "/tools"
              help: 填写后台菜单项的链接路径，建议以 / 开头
            - $formkit: text
              name: icon
              label: Iconify 图标名称
              value: "octicon:star-16"
              placeholder: "octicon:tools-16"
        - $formkit: text
          name: fallback
          label: 未匹配菜单默认图标
          value: "octicon:star-16"
          help: 只有菜单路径没有匹配到上面的自定义规则时才使用
    - group: business
      label: 服务设置
      formSchema:
        - $formkit: checkbox
          name: enabled
          label: 启用服务页面
          value: true
          help: 关闭后服务页面显示为空状态，但不会影响后台菜单配置
        - $formkit: text
          name: title
          label: 页面标题
          value: "我可以为你做什么"
          placeholder: "我可以为你做什么"
        - $formkit: textarea
          name: intro
          label: 页面介绍
          value: "从基础设施到网络接入，为个人与企业提供清晰、可靠、可落地的技术服务。点击卡片查看服务范围和联系方式。"
          help: 显示在服务卡片上方，支持换行
        - $formkit: array
          name: services
          label: 服务项目
          value:
            - enabled: true
              name: "服务器"
              summary: "选型、部署、迁移与稳定性维护"
              description: "覆盖云服务器与物理服务器，从配置选型、系统初始化到服务上线和日常维护，帮助网站与应用稳定运行。"
              deliverables: "服务器选型与配置建议\nLinux 系统部署与安全加固\n网站、数据库与容器部署\n监控、备份与故障排查"
              price: "按配置与工作量评估"
              icon: "octicon:server-16"
              contact_label: "咨询服务器服务"
              contact_url: "mailto:your@example.com?subject=服务器服务咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
            - enabled: true
              name: "SSL 证书"
              summary: "证书申请、部署与 HTTPS 排障"
              description: "为网站、API 和后台系统配置可靠的 HTTPS 访问，处理证书申请、域名验证、自动续期以及浏览器安全告警。"
              deliverables: "证书类型与品牌选型\n域名验证与证书签发\nNginx、Apache、CDN 部署\n续期配置与 HTTPS 故障排查"
              price: "按证书类型与站点数量评估"
              icon: "octicon:shield-check-16"
              contact_label: "咨询 SSL 证书"
              contact_url: "mailto:your@example.com?subject=SSL证书咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
            - enabled: true
              name: "品牌机"
              summary: "办公、设计与企业采购配置"
              description: "根据预算、软件环境和使用场景匹配品牌台式机、笔记本与工作站，兼顾性能、售后和后续扩展。"
              deliverables: "使用场景与预算梳理\n品牌型号与配置对比\n批量采购与到货验收建议\n系统初始化与软件环境配置"
              price: "按型号与采购数量报价"
              icon: "octicon:device-desktop-16"
              contact_label: "咨询品牌机服务"
              contact_url: "mailto:your@example.com?subject=品牌机咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
            - enabled: true
              name: "组装机"
              summary: "按需定制，平衡性能、预算与升级空间"
              description: "针对办公、开发、设计和轻度创作等需求定制主机方案，细化每一项配件，减少性能浪费和兼容性风险。"
              deliverables: "需求分析与整机方案\nCPU、显卡与存储搭配\n配件兼容性与散热评估\n装机验机与系统调试"
              price: "按配置方案报价"
              icon: "octicon:cpu-16"
              contact_label: "咨询组装机服务"
              contact_url: "mailto:your@example.com?subject=组装机咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
            - enabled: true
              name: "中文网址"
              summary: "中文域名注册、解析与品牌保护"
              description: "为品牌、项目和个人站点提供中文域名的注册建议、实名认证、DNS 解析与访问配置，让网址更易记、更贴近品牌。"
              deliverables: "域名后缀与名称建议\n注册、实名认证与转移\nDNS 解析与访问配置\n续费提醒与域名保护建议"
              price: "按域名后缀与注册年限报价"
              icon: "octicon:globe-16"
              contact_label: "咨询中文网址"
              contact_url: "mailto:your@example.com?subject=中文网址咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
            - enabled: true
              name: "SD-WAN"
              summary: "多分支互联、链路优化与网络可视化"
              description: "面向门店、分支和远程办公场景，梳理现有线路与服务流量，设计更稳定、可观测、易运维的 SD-WAN 接入方案。"
              deliverables: "网络现状与链路质量评估\n组网架构与设备选型建议\n策略下发、链路调度与容灾\n上线验收与运维交接"
              price: "按站点数量与组网复杂度评估"
              icon: "octicon:workflow-16"
              contact_label: "咨询 SD-WAN 服务"
              contact_url: "mailto:your@example.com?subject=SD-WAN咨询"
              contact_wechat: ""
              contact_qq: ""
              contact_phone: ""
              background_image: ""
          addLabel: 添加服务项目
          emptyText: 暂无服务项目，请添加后在前台展示
          help: 关闭某项的“显示此服务”后，该项目不会出现在前台
          itemLabels:
            - type: text
              label: "$value.name"
          children:
            - $formkit: checkbox
              name: enabled
              label: 显示此服务
              value: true
            - $formkit: text
              name: name
              label: 服务名称
              value: ""
              placeholder: "服务器运维"
            - $formkit: text
              name: summary
              label: 卡片简介
              value: ""
              placeholder: "一句话说明这项服务"
            - $formkit: textarea
              name: description
              label: 详细介绍
              value: ""
              placeholder: "介绍适用场景、服务方式和你能解决的问题"
            - $formkit: textarea
              name: deliverables
              label: 服务内容
              value: ""
              placeholder: "每行填写一项服务内容"
              help: 每行一项，前台详情弹窗会自动转换为列表
            - $formkit: text
              name: price
              label: 费用说明
              value: ""
              placeholder: "按项目评估"
            - $formkit: text
              name: icon
              label: Iconify 图标
              value: "octicon:briefcase-16"
              placeholder: "octicon:server-16"
            - $formkit: text
              name: contact_label
              label: 联系按钮文字
              value: "立即咨询"
              placeholder: "立即咨询"
            - $formkit: text
              name: contact_url
              label: 联系地址
              value: ""
              placeholder: "mailto:you@example.com 或 https://..."
            - $formkit: text
              name: contact_wechat
              label: 微信号
              value: ""
              placeholder: "填写后在详情中显示"
            - $formkit: text
              name: contact_qq
              label: QQ 号
              value: ""
              placeholder: "填写后在详情中显示"
            - $formkit: text
              name: contact_phone
              label: 手机号
              value: ""
              placeholder: "填写后在详情中显示"
            - $formkit: attachment
              name: background_image
              label: 卡片背景图片
              value: ""
              accept: "image/*"
              help: 可上传或从附件库选择卡片背景图片；留空则使用默认卡片背景
    - group: about
      label: 关于设置
      formSchema:
        - $formkit: checkbox
          name: show_tags
          label: 显示个人标签
          value: true
        - $formkit: array
          name: tags
          label: 个人标签
          value:
            - text: "💻 运维开发"
            - text: "📚 终身学习"
            - text: "🏓 台球"
            - text: "⌨️ 击键爱好者"
            - text: "🛠️ AMT-er"
            - text: "🏁 INFA-J"
            - text: "🧑‍💻 技术实践"
            - text: "🚀 持续折腾"
          addLabel: 添加标签
          emptyText: 暂无个人标签
          itemLabels:
            - type: text
              label: "$value.text"
          children:
            - $formkit: text
              name: text
              label: 标签文字
              value: ""
              placeholder: "💻 运维开发"
        - $formkit: textarea
          name: intro
          label: 关于本站
          value: |-
            嗨，欢迎来到我的小站。这里是我存放运维笔记、记录日常点滴的自留地。

            一名闲不住、天天和服务器对线的运维人，平日主要调集群、排查各类线上故障，有空就折腾自动化脚本提升效率。

            本站一半记录生活碎片，一半分享一路走来踩过的运维坑与实操经验。
          help: 支持换行；留空时显示 Halo 关于页正文
        - $formkit: checkbox
          name: show_skills
          label: 显示技能与认证
          value: true
        - $formkit: array
          name: skills
          label: 技能与认证
          value:
            - name: "2025 · 信息技术处理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · 信息系统运行管理员（软考）"
              icon: "octicon:verified-16"
              level: 100
            - name: "2025 · OCP（Oracle）"
              icon: "simple-icons:oracle"
              level: 88
