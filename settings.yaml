    - group: styles
      label: 样式
      formSchema:
        - $formkit: color
          name: background_color
          label: 背景颜色
          value: "#ffffff"
        - $formkit: color
          name: accent_color
          label: 强调色
          value: "#0969da"
        - $formkit: checkbox
          name: archive_cover_enabled
          label: 归档列表显示封面背景
          value: false
          help: 开启后，有封面图的文章会在 /archives 列表中显示渐变封面背景
        - $formkit: checkbox
          name: header_clock_enabled
          label: 显示顶部时间
          value: false
          help: 开启后，在前台右上角显示当前本地时间，例如“8月15日 周五 10:30”
        - $formkit: checkbox
          name: weather_enabled
          label: 启用天气显示
          value: false
          help: 开启后在顶部搜索框之后显示实时天气，数据来自无需密钥的 Open-Meteo
        - $formkit: checkbox
          name: weather_auto_location
          label: 优先使用访客定位
          value: true
          help: 首次访问会请求浏览器定位权限；拒绝或定位失败时使用下方预设城市
        - $formkit: text
          name: weather_location
          label: 天气城市名称
          value: "深圳"
          placeholder: "深圳"
          help: 访客定位不可用时显示的备用城市
        - $formkit: text
          name: weather_latitude
          label: 天气纬度
          value: "22.5431"
          placeholder: "22.5431"
          help: 例如深圳为 22.5431，可从地图服务查询城市坐标
        - $formkit: text
          name: weather_longitude
          label: 天气经度
          value: "114.0579"
          placeholder: "114.0579"
          help: 例如深圳为 114.0579，可从地图服务查询城市坐标
        - $formkit: checkbox
          name: music_player_enabled
          label: 启用悬浮播放器
          value: false
          help: 开启并填写歌单 ID 后，在前台显示播放器并尝试自动播放
        - $formkit: select
          name: music_player_position
          label: 播放器显示位置
          value: "bottom-left"
          options:
            - label: "左下角"
              value: "bottom-left"
            - label: "右上角"
              value: "top-right"
          help: 选择右上角后，播放器显示在顶部搜索框之后，采用紧凑的 macOS 音乐播放器样式
        - $formkit: select
          name: music_source
          label: 音乐数据源
          value: "netease"
          options:
            - label: "网易云音乐（默认接口）"
              value: "netease"
            - label: "自定义 API"
              value: "custom"
          help: 默认使用兼容 Meting 格式的网易云歌单接口；其他平台请选择自定义 API
        - $formkit: text
          name: music_playlist_id
          label: 歌单 ID
          value: ""
          placeholder: "例如 3778678"
          help: "网易云音乐请填写歌单 ID；自定义 API 可在接口地址中使用 {id} 引用此值"
        - $formkit: select
          name: music_playback_mode
          label: 默认播放模式
          value: "sequence"
          options:
            - label: "顺序播放"
              value: "sequence"
            - label: "随机播放"
              value: "shuffle"
          help: 首次打开播放器时使用；用户在前台切换的模式会在当前标签页内保持
        - $formkit: checkbox
          name: music_autoplay
          label: 自动播放
          value: false
          help: 开启后播放器加载完成即尝试自动播放；浏览器通常会拦截未交互的自动播放
        - $formkit: checkbox
          name: music_hide_on_mobile
          label: 移动端隐藏播放器
          value: false
          help: 开启后在手机等窄屏设备上不显示悬浮播放器
        - $formkit: text
          name: music_api
          label: 音乐 API 地址
          value: "https://api.i-meto.com/meting/api?server=netease&type=playlist&id={id}"
          placeholder: "https://api.example.com/playlist?id={id}"
          help: "{id} 会替换为歌单 ID。接口需返回歌曲数组，或 data 包装的数组；单曲字段支持 title/name、artist/author、url 和 cover/pic"
