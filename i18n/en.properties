about.defaultIntro1=Hi there, welcome to my little corner of the internet — a personal home for ops notes and everyday jotting down.
about.defaultIntro2=An ops engineer who is never idle and always up for a fight with the servers, spending days tuning clusters and chasing production incidents, and scripting things to work better.
