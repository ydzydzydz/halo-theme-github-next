<include
  src="layout.html"
  activeHome=""
  activePosts=""
  activeProjects=""
  activePackages="is-active"
  shellClass=""
  sidebarClass=""
  contentClass=""
>
  <template name="head">
    <title th:text="|${tag.spec.displayName} - ${site.title}|">Tag Archive</title>
  </template>

  <section class="links-hero taxonomy-hero">
    <div>
      <p class="links-eyebrow">Tags</p>
      <h1 th:text="|标签：${tag.spec.displayName}|"></h1>
      <p th:text="${tag.spec.description} ?: '查看该标签下的全部文章。'"></p>
    </div>
    <span class="links-count" th:if="${posts != null}">
      <span th:text="${posts.total ?: 0}">0</span>
      <span>篇文章</span>
    </span>
  </section>

  <ul class="repository-list repository-list--bordered">
    <include src="repository-post-item.html"></include>
    <li class="repository-empty" th:if="${posts.total == 0}">
      <span>该标签下暂无文章</span>
    </li>
  </ul>

  <include src="pagination.html"></include>
</include>
