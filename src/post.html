<include
  src="layout.html"
  activeHome=""
  activePosts="is-active"
  activeProjects=""
  activePackages=""
  shellClass=""
  sidebarClass=""
  contentClass=""
>
  <template name="head">
    <title th:text="|${post.spec.title} - ${site.title}|">Post Title</title>
    <script type="module" src="./js/post.ts"></script>
  </template>

  <article class="post-article">
    <header
      class="article-header"
      th:classappend="${not #strings.isEmpty(post.spec.cover) ? 'article-header--cover' : ''}"
      th:style="|--article-cover: url('${post.spec.cover}')|"
    >
      <h1 class="article-title" th:text="${post.spec.title}"></h1>
      <div class="article-meta">
        <time th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd')}"></time>
        <span th:if="${not #lists.isEmpty(post.categories)}">
          &nbsp;·&nbsp;
          <a
            th:each="cat : ${post.categories}"
            th:href="@{${cat.status.permalink}}"
            th:text="${cat.spec.displayName}"
            class="category"
          ></a>
        </span>
      </div>
    </header>

    <div class="article-content" th:utext="${post.content.content}"></div>

    <div class="article-tags" th:if="${not #lists.isEmpty(post.tags)}">
      <a
        th:each="tag : ${post.tags}"
        th:href="@{${tag.status.permalink}}"
        th:text="${tag.spec.displayName}"
        class="tag"
      ></a>
    </div>

    <nav class="post-nav" th:with="cursor = ${postFinder.cursor(post.metadata.name)}">
      <span>
        <a
          th:if="${cursor.hasPrevious()}"
          th:href="@{${cursor.previous.status.permalink}}"
          th:text="|← ${cursor.previous.spec.title}|"
        ></a>
      </span>
      <span>
        <a
          th:if="${cursor.hasNext()}"
          th:href="@{${cursor.next.status.permalink}}"
          th:text="|${cursor.next.spec.title} →|"
        ></a>
      </span>
    </nav>
  </article>

  <nav class="post-side-actions" th:attr="aria-label=#{post.sideActions}">
    <span class="post-side-action-slot">
      <button
        class="post-side-action post-back-to-top"
        type="button"
        data-post-back-to-top
        hidden
        th:attr="aria-label=#{footer.backToTop}, title=#{footer.backToTop}"
      >
        <iconify-icon icon="icon-park-outline:to-top" aria-hidden="true"></iconify-icon>
      </button>
    </span>
    <button
      class="post-side-action post-upvote"
      type="button"
      th:attr="data-post-upvote=${post.metadata.name}, aria-label=#{post.upvote}, title=#{repository.upvote}"
    >
      <iconify-icon icon="octicon:thumbsup-16" aria-hidden="true"></iconify-icon>
    </button>
    <a
      class="post-side-action"
      href="#comments"
      th:attr="aria-label=#{post.viewComments}, title=#{repository.comment}"
    >
      <iconify-icon icon="octicon:comment-16" aria-hidden="true"></iconify-icon>
    </a>
  </nav>

  <section class="post-comments" id="comments" th:attr="aria-label=#{post.commentArea}">
    <header class="post-comments-header">
      <iconify-icon icon="octicon:comment-discussion-16" aria-hidden="true"></iconify-icon>
      <strong th:text="#{comment.title}">评论</strong>
    </header>
    <div class="post-comments-body">
      <halo:comment
        th:if="${haloCommentEnabled}"
        group="content.halo.run"
        kind="Post"
        th:attr="name=${post.metadata.name}"
      />
    </div>
  </section>
</include>
