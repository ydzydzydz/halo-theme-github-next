<include
  src="layout.html"
  activeHome="is-active"
  activePosts=""
  activeProjects=""
  activePackages=""
  shellClass=""
  sidebarClass=""
  contentClass=""
>
  <template name="head">
    <title th:text="${site.title}">Home</title>
    <script type="module" src="./js/index.ts"></script>
  </template>

  <section
    class="readme-card"
    data-readme-card
    th:if="${theme.config.readme?.enabled != false and not #strings.isEmpty(theme.config.readme?.content)}"
    th:attr="data-readme-content=${theme.config.readme?.content}"
  >
    <header class="readme-card-header">
      <span class="readme-card-file">
        <iconify-icon icon="octicon:file-16" aria-hidden="true"></iconify-icon>
        <span th:text="${theme.config.readme?.title ?: 'README.md'}">README.md</span>
      </span>
      <span class="readme-card-badge">Markdown</span>
    </header>
    <div class="readme-card-body readme-content" data-readme-body></div>
  </section>

  <section class="section-heading">
    <h2 th:text="#{index.latestPosts}">最新文章</h2>
    <a th:href="@{/archives}" th:text="#{index.morePosts}">更多文章</a>
  </section>

  <ul class="repo-grid pinned-repos">
    <include src="latest-post-card.html"></include>
  </ul>

  <div
    class="contrib-layout"
    data-contribution-root
    th:attr="data-activity-limit=${theme.config.basic.activity_limit ?: 6}"
  >
    <section class="contribution-area">
      <div class="section-heading compact">
        <h2 data-contribution-total th:text="#{index.contributionLoading}">
          Loading contributions...
        </h2>
        <span class="contribution-source" th:text="#{index.activitySubtitle}"
          >Posts, moments, tags, categories, and photos</span
        >
      </div>
      <div class="contribution-panel">
        <div class="contribution-scroll">
          <div class="contribution-months" data-contribution-months></div>
          <div class="contribution-body">
            <div class="contribution-weekdays" aria-hidden="true">
              <span th:text="#{weekday.mon}">Mon</span>
              <span th:text="#{weekday.wed}">Wed</span>
              <span th:text="#{weekday.fri}">Fri</span>
            </div>
            <div
              class="contribution-graph"
              data-contribution-graph
              role="grid"
              th:attr="aria-label=#{index.contributionTitle}"
            ></div>
          </div>
        </div>
        <div class="contribution-footer">
          <a th:href="@{/archives}" th:text="#{activity.heading}">View all posts</a>
          <div class="contribution-legend">
            <span th:text="#{index.contributionLess}">Less</span>
            <span class="day level-0"></span>
            <span class="day level-1"></span>
            <span class="day level-2"></span>
            <span class="day level-3"></span>
            <span class="day level-4"></span>
            <span th:text="#{index.contributionMore}">More</span>
          </div>
        </div>
      </div>
    </section>
    <aside
      class="year-nav"
      data-contribution-years
      th:attr=" aria-label=#{index.contributionYears}"
    ></aside>

    <section class="activity-section">
      <h2 data-activity-heading th:text="#{activity.heading}">Site activity</h2>
      <div data-contribution-activity>
        <p class="activity-empty" th:text="#{activity.loading}">Loading activity...</p>
      </div>
      <nav class="pagination activity-pagination" data-activity-pagination hidden>
        <button type="button" data-activity-previous th:text="#{pagination.previous}">
          Previous
        </button>
        <span data-activity-page></span>
        <button type="button" data-activity-next th:text="#{pagination.next}">Next</button>
      </nav>
    </section>
  </div>
</include>
