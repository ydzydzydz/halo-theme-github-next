<include
  src="layout.html"
  activeHome=""
  activePosts="is-active"
  activeProjects=""
  activePackages=""
  shellClass=""
  sidebarClass=""
  contentClass=""
  showBackToTop="true"
>
  <template name="head">
    <title th:text="|#{archives.title} - ${site.title}|">文章</title>
    <script type="module" src="./js/archives.ts"></script>
  </template>

  <section class="repositories-page">
    <!--
      归档页筛选完全由服务端渲染：
      1. raw* 读取 URL 查询参数（category / tag / sort / page）
      2. categoryName / tagName 传入 postFinder.list 做真实过滤，sortSpec 控制排序
      3. q* 变量拼装干净的查询串，保证翻页与切换筛选时状态不丢失
    -->
    <th:block
      th:with="rawCategory=${#lists.size(param.category) > 0 ? param.category[0] : ''},
               rawTag=${#lists.size(param.tag) > 0 ? param.tag[0] : ''},
               rawSort=${#lists.size(param.sort) > 0 ? param.sort[0] : ''},
               rawPage=${#lists.size(param.page) > 0 ? param.page[0] : ''}"
    >
      <th:block
        th:with="categoryName=${#strings.isEmpty(rawCategory) ? null : rawCategory},
                 tagName=${#strings.isEmpty(rawTag) ? null : rawTag},
                 sortKey=${rawSort == 'oldest' ? 'oldest' : (rawSort == 'title' ? 'title' : 'newest')},
                 sortParam=${rawSort == 'oldest' ? 'oldest' : (rawSort == 'title' ? 'title' : null)},
                 sortSpec=${rawSort == 'oldest' ? {'spec.publishTime,asc'} : (rawSort == 'title' ? {'spec.title,asc'} : {'spec.publishTime,desc'})},
                 pageNum=${#strings.isEmpty(rawPage) ? (archives != null and archives.page != null ? #strings.toString(archives.page) : '1') : (rawPage.matches('[0-9]+') ? rawPage : '1')},
                 pageSize=${archives != null and archives.size != null and archives.size > 0 ? archives.size : 8}"
      >
        <th:block
          th:with="posts=${postFinder.list({page: pageNum, size: pageSize, categoryName: categoryName, tagName: tagName, sort: sortSpec})},
                   pCat=${categoryName != null ? 'category=' + categoryName : ''},
                   pTag=${tagName != null ? 'tag=' + tagName : ''},
                   pSort=${sortParam != null ? 'sort=' + sortParam : ''}"
        >
          <th:block
            th:with="qAll=${pCat != '' ? '?' + pCat + (pTag != '' ? '&' + pTag : '') + (pSort != '' ? '&' + pSort : '') : (pTag != '' ? '?' + pTag + (pSort != '' ? '&' + pSort : '') : (pSort != '' ? '?' + pSort : ''))},
                     qNoCat=${pTag != '' ? '?' + pTag + (pSort != '' ? '&' + pSort : '') : (pSort != '' ? '?' + pSort : '')},
                     qNoTag=${pCat != '' ? '?' + pCat + (pSort != '' ? '&' + pSort : '') : (pSort != '' ? '?' + pSort : '')},
                     qNoSort=${pCat != '' ? '?' + pCat + (pTag != '' ? '&' + pTag : '') : (pTag != '' ? '?' + pTag : '')},
                     qOnlySort=${pSort != '' ? '?' + pSort : ''},
                     catTail=${(pTag != '' ? '&' + pTag : '') + (pSort != '' ? '&' + pSort : '')},
                     tagHead=${pCat != '' ? '?' + pCat + '&' : '?'},
                     tagTail=${pSort != '' ? '&' + pSort : ''}"
          >
            <th:block
              th:with="sortHead=${qNoSort != '' ? qNoSort + '&' : '?'},
                       prevQuery=${qAll != '' ? qAll + '&page=' + (posts.page - 1) : '?page=' + (posts.page - 1)},
                       nextQuery=${qAll != '' ? qAll + '&page=' + (posts.page + 1) : '?page=' + (posts.page + 1)}"
            >
              <div class="repositories-toolbar">
                <!--
                  归档页的搜索是内联的：输入关键词后列表直接换成全站搜索结果，
                  不再弹出遮罩层。搜索逻辑在 src/js/archives.ts。
                -->
                <div class="repository-search-field" data-archive-search-field>
                  <svg class="repository-search-icon" viewBox="0 0 16 16" aria-hidden="true">
                    <path
                      d="M10.68 11.74a6 6 0 1 1 1.06-1.06l3.04 3.04a.75.75 0 1 1-1.06 1.06ZM11.5 7a4.5 4.5 0 1 0-9 0 4.5 4.5 0 0 0 9 0Z"
                    />
                  </svg>
                  <input
                    class="repository-search"
                    type="search"
                    data-archive-search-input
                    autocomplete="off"
                    spellcheck="false"
                    th:attr="placeholder=#{archives.searchPlaceholder}, aria-label=#{archives.searchLabel}"
                  />
                  <button
                    class="repository-search-clear"
                    type="button"
                    data-archive-search-clear
                    hidden
                    th:attr="aria-label=#{archives.exitSearch}, title=#{archives.exitSearch}"
                  >
                    <svg viewBox="0 0 16 16" aria-hidden="true">
                      <path
                        d="M3.72 3.72a.75.75 0 0 1 1.06 0L8 6.94l3.22-3.22a.749.749 0 0 1 1.275.326.749.749 0 0 1-.215.734L9.06 8l3.22 3.22a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215L8 9.06l-3.22 3.22a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042L6.94 8 3.72 4.78a.75.75 0 0 1 0-1.06Z"
                      />
                    </svg>
                  </button>
                </div>
                <div class="repository-filters" th:attr="aria-label=#{archives.filterLabel}">
                  <button
                    class="repository-filter-button"
                    type="button"
                    data-repository-filter="category"
                    th:classappend="${categoryName != null} ? 'is-active'"
                    data-repository-filter-default="#{archives.filterCategoryShort}"
                    aria-expanded="false"
                    aria-haspopup="true"
                  >
                    <span data-repository-filter-label>
                      <th:block
                        th:if="${categoryName == null}"
                        th:text="#{archives.filterCategoryShort}"
                        >分类</th:block
                      >
                      <th:block
                        th:each="cat : ${categoryFinder.listAll()}"
                        th:if="${cat.metadata.name == categoryName}"
                        th:text="${cat.spec.displayName}"
                      ></th:block>
                    </span>
                    <span class="chevron"></span>
                  </button>
                  <div
                    class="repository-filter-menu"
                    data-repository-filter-menu="category"
                    role="menu"
                    th:attr="aria-label=#{archives.filterByCategory}"
                    hidden
                  >
                    <a
                      class="repository-filter-option"
                      th:classappend="${categoryName == null} ? 'is-active'"
                      th:href="@{/archives} + ${qNoCat}"
                      th:text="#{archives.allCategories}"
                    ></a>
                    <a
                      class="repository-filter-option"
                      th:each="cat : ${categoryFinder.listAll()}"
                      th:classappend="${cat.metadata.name == categoryName} ? 'is-active'"
                      th:href="@{/archives} + '?category=' + ${cat.metadata.name} + ${catTail}"
                      th:text="${cat.spec.displayName}"
                    ></a>
                  </div>

                  <button
                    class="repository-filter-button"
                    type="button"
                    data-repository-filter="tag"
                    th:classappend="${tagName != null} ? 'is-active'"
                    data-repository-filter-default="#{archives.filterTagShort}"
                    aria-expanded="false"
                    aria-haspopup="true"
                  >
                    <span data-repository-filter-label>
                      <th:block th:if="${tagName == null}" th:text="#{archives.filterTagShort}"
                        >标签</th:block
                      >
                      <th:block
                        th:each="tg : ${tagFinder.listAll()}"
                        th:if="${tg.metadata.name == tagName}"
                        th:text="${tg.spec.displayName}"
                      ></th:block>
                    </span>
                    <span class="chevron"></span>
                  </button>
                  <div
                    class="repository-filter-menu"
                    data-repository-filter-menu="tag"
                    role="menu"
                    th:attr="aria-label=#{archives.filterByTag}"
                    hidden
                  >
                    <a
                      class="repository-filter-option"
                      th:classappend="${tagName == null} ? 'is-active'"
                      th:href="@{/archives} + ${qNoTag}"
                      th:text="#{archives.allTags}"
                    ></a>
                    <a
                      class="repository-filter-option"
                      th:each="tg : ${tagFinder.listAll()}"
                      th:classappend="${tg.metadata.name == tagName} ? 'is-active'"
                      th:href="@{/archives} + ${tagHead} + 'tag=' + ${tg.metadata.name} + ${tagTail}"
                      th:text="${tg.spec.displayName}"
                    ></a>
                  </div>

                  <button
                    class="repository-filter-button"
                    type="button"
                    data-repository-filter="sort"
                    th:classappend="${sortKey != 'newest'} ? 'is-active'"
                    data-repository-filter-default="#{archives.filterSortShort}"
                    aria-expanded="false"
                    aria-haspopup="true"
                  >
                    <span data-repository-filter-label>
                      <th:block th:if="${sortKey == 'newest'}" th:text="#{archives.filterSortShort}"
                        >排序</th:block
                      >
                      <th:block th:if="${sortKey == 'oldest'}" th:text="#{archives.sortOldest}"
                        >最早发布</th:block
                      >
                      <th:block th:if="${sortKey == 'title'}" th:text="#{archives.sortTitle}"
                        >标题 A-Z</th:block
                      >
                    </span>
                    <span class="chevron"></span>
                  </button>
                  <div
                    class="repository-filter-menu"
                    data-repository-filter-menu="sort"
                    role="menu"
                    th:attr="aria-label=#{archives.filterBySort}"
                    hidden
                  >
                    <a
                      class="repository-filter-option"
                      th:classappend="${sortKey == 'newest'} ? 'is-active'"
                      th:href="@{/archives} + ${qNoSort}"
                      th:text="#{archives.sortNewest}"
                    ></a>
                    <a
                      class="repository-filter-option"
                      th:classappend="${sortKey == 'oldest'} ? 'is-active'"
                      th:href="@{/archives} + ${sortHead} + 'sort=oldest'"
                      th:text="#{archives.sortOldest}"
                    ></a>
                    <a
                      class="repository-filter-option"
                      th:classappend="${sortKey == 'title'} ? 'is-active'"
                      th:href="@{/archives} + ${sortHead} + 'sort=title'"
                      th:text="#{archives.sortTitle}"
                    ></a>
                  </div>
                </div>
              </div>

              <!-- 搜索状态条：仅在搜索模式下出现，说明当前列表是搜索结果 -->
              <div
                class="repository-search-status"
                data-archive-search-status
                role="status"
                aria-live="polite"
                hidden
              >
                <span data-archive-search-status-text></span>
                <button
                  class="repository-search-exit"
                  type="button"
                  data-archive-search-exit
                  th:text="#{archives.exitSearch}"
                >
                  退出搜索
                </button>
              </div>

              <ul class="repository-list" data-archive-search-list>
                <include src="repository-post-item.html"></include>
                <li class="repository-empty" th:if="${posts.total == 0}">
                  <span th:text="#{archives.noMatch}">没有符合条件的文章</span>
                  <a
                    th:if="${categoryName != null or tagName != null}"
                    th:href="@{/archives} + ${qOnlySort}"
                  >
                    th:text="#{archives.clearFilters}"
                  </a>
                </li>
              </ul>

              <nav
                class="pagination"
                data-archive-pagination
                th:if="${posts.hasPrevious() || posts.hasNext()}"
              >
                <a
                  th:if="${posts.hasPrevious()}"
                  th:href="@{/archives} + ${prevQuery}"
                  th:text="#{pagination.previous}"
                  >上一页</a
                >
                <a
                  th:unless="${posts.hasPrevious()}"
                  aria-disabled="true"
                  th:text="#{pagination.previous}"
                  >上一页</a
                >
                <span th:text="|${posts.page} / ${posts.totalPages}|"></span>
                <a
                  th:if="${posts.hasNext()}"
                  th:href="@{/archives} + ${nextQuery}"
                  th:text="#{pagination.next}"
                  >下一页</a
                >
                <a th:unless="${posts.hasNext()}" aria-disabled="true" th:text="#{pagination.next}"
                  >下一页</a
                >
              </nav>

              <!--
                分类 / 标签的显示名与永久链接映射。
                搜索接口只返回 metadata.name，前端靠这张表把搜索结果里的
                分类、标签还原成可点击的名称与链接。
              -->
              <div class="repository-taxonomy" data-archive-taxonomy hidden>
                <span
                  th:each="cat : ${categoryFinder.listAll()}"
                  th:attr="data-kind=category, data-name=${cat.metadata.name}, data-display=${cat.spec.displayName}, data-permalink=${cat.status.permalink}"
                ></span>
                <span
                  th:each="tg : ${tagFinder.listAll()}"
                  th:attr="data-kind=tag, data-name=${tg.metadata.name}, data-display=${tg.spec.displayName}, data-permalink=${tg.status.permalink}"
                ></span>
              </div>
            </th:block>
          </th:block>
        </th:block>
      </th:block>
    </th:block>
  </section>
</include>
