name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/theme-cd.yaml@v5
    permissions:
      contents: write
    with:
      skip-appstore-release: true
      # pnpm/action-setup 仅在版本号非空且与 package.json 的 packageManager
      # 不完全一致时报错，这里必须与 packageManager 里的版本保持一致
      pnpm-version: "10.33.0"
