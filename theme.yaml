apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-github-next
spec:
  displayName: GitHub Next
  author:
    name: ydzydzydz
    website: https://github.com/ydzydzydz
  description: 仿 GitHub 个人主页风格的 Halo 2 主题，基于原仓库 dengchuanfu/halo-theme-github 二次开发。
  logo: /themes/theme-github-next/assets/github-logo.png
  homepage: https://github.com/ydzydzydz/theme-github-next
  repo: https://github.com/ydzydzydz/theme-github-next
  issues: https://github.com/ydzydzydz/theme-github-next/issues
  settingName: "theme-github-next-setting"
  configMapName: "theme-github-next-configMap"
  customTemplates:
    page:
      - name: 留言板
        description: 带评论飘屏效果的留言板页面
        file: message.html
      - name: 服务
        description: 可配置服务项目并支持点击查看详情的服务展示页面
        file: business.html
  version: 1.0.13
  requires: ">=2.0.0"
  license:
    - name: "GPL-3.0"
      url: "https://github.com/ydzydzydz/theme-github-next/blob/main/LICENSE"
